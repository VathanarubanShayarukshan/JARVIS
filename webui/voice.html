<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Voice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.container{text-align:center;max-width:500px;width:90%}
.status{font-size:18px;margin:20px 0;min-height:60px;color:#8b949e;transition:color .3s}
.status.listening{color:#ffd166}
.status.speaking{color:#7ee787}
.status.sending{color:#79c0ff}
.transcript{font-size:22px;margin:16px 0;min-height:32px;color:#e6edf3;opacity:.9}
.wave-container{margin:30px auto;width:200px;height:100px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.wave-bar{width:6px;background:var(--bar-color,#ffd166);border-radius:3px;transition:height .1s;min-height:4px}
.wave-bar.active{animation:wave .6s ease-in-out infinite}
@keyframes wave{0%,100%{height:var(--h1)}50%{height:var(--h2)}}
.wave-bar:nth-child(1){--h1:8px;--h2:40px;animation-delay:0s}
.wave-bar:nth-child(2){--h1:12px;--h2:55px;animation-delay:.08s}
.wave-bar:nth-child(3){--h1:6px;--h2:70px;animation-delay:.16s}
.wave-bar:nth-child(4){--h1:14px;--h2:45px;animation-delay:.24s}
.wave-bar:nth-child(5){--h1:10px;--h2:60px;animation-delay:.32s}
.wave-bar:nth-child(6){--h1:8px;--h2:50px;animation-delay:.40s}
.wave-bar:nth-child(7){--h1:12px;--h2:35px;animation-delay:.48s}
.logo{font-size:64px;margin-bottom:10px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.hint{font-size:12px;color:#484f58;margin-top:24px}
.hidden{display:none!important}
#auth-overlay{position:fixed;inset:0;background:rgba(10,14,23,.95);display:flex;align-items:center;justify-content:center;z-index:100}
#auth-overlay .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;max-width:340px;width:90%;text-align:center}
#auth-overlay h2{margin-bottom:12px}
#auth-overlay input{width:100%;padding:10px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;margin:6px 0;font-size:14px}
#auth-overlay button{width:100%;padding:10px;border-radius:8px;border:none;background:#238636;color:#fff;font-size:14px;cursor:pointer;margin-top:8px}
#auth-overlay .error{color:#f85149;font-size:12px;margin-top:6px}
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="card">
    <h2>JARVIS Voice</h2>
    <p style="color:#8b949e;margin-bottom:12px">Sign in to start talking</p>
    <input type="password" id="auth-pass" placeholder="admin password">
    <button id="auth-btn">Sign in</button>
    <p class="error" id="auth-error"></p>
  </div>
</div>

<div class="container">
  <div class="logo">🤖</div>
  <div class="wave-container" id="wave">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>
  <div class="status" id="status">Tap anywhere to start</div>
  <div class="transcript" id="transcript"></div>
  <div class="hint">Talk naturally — no buttons needed. JARVIS listens, thinks, and replies.</div>
</div>

<script>
"use strict";
const API = location.origin;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let token = localStorage.getItem("token") || "";
let sessionId = null;
let rec = null;
let busy = false;
let buffer = [];
let currentLang = "en-US";
let silenceTimer = null;

const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const waveEl = document.getElementById("wave");
const bars = waveEl.querySelectorAll(".wave-bar");

function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.className = "status" + (cls ? " " + cls : "");
}
function setWave(cls) {
  bars.forEach((b) => b.classList.toggle("active", cls === "listen" || cls === "speak"));
  waveEl.style.setProperty("--bar-color", cls === "speak" ? "#7ee787" : cls === "listen" ? "#ffd166" : "#484f58");
}

async function apiCall(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  let body = opts.body;
  if (body && typeof body === "object" && !(body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }
  const r = await fetch(API + path, Object.assign({}, opts, { headers, body }));
  return r;
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await apiCall("/api/sessions", { method: "POST", body: {} });
  if (!r.ok) throw new Error("cannot create session");
  const j = await r.json();
  sessionId = j.id;
  return sessionId;
}

async function sendMessage(text) {
  busy = true;
  setStatus("Thinking…", "sending");
  setWave("none");
  try {
    await ensureSession();
    const r = await apiCall("/api/chat", {
      method: "POST",
      body: { session_id: sessionId, message: text },
    });
    if (!r.ok) throw new Error("chat failed");
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const dl = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!dl) continue;
        let ev;
        try { ev = JSON.parse(dl.slice(6)); } catch { continue; }
        if (ev.type === "text") full += ev.text;
        if (ev.type === "done" && ev.content) full = ev.content;
        if (ev.type === "error") full = "Error: " + ev.message;
      }
    }
    busy = false;
    if (full.trim()) speak(full);
    else { busy = false; listen(); }
  } catch (e) {
    busy = false;
    speak("Sorry, something went wrong. " + e.message);
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) { busy = false; listen(); return; }
  speechSynthesis.cancel();
  setStatus("Speaking…", "speaking");
  setWave("speak");
  const plain = String(text).replace(/```[\s\S]*?```/g, " code block. ").replace(/`([^`]*)`/g, "$1").replace(/[*_#>\[\]()|]/g, "").replace(/\s+/g, " ").trim();
  const chunks = plain.match(/[\s\S]{1,180}(\s|$)/g) || [plain];
  let i = 0;
  function nextChunk() {
    if (i >= chunks.length) {
      setWave("none");
      busy = false;
      setTimeout(listen, 400);
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    const voices = speechSynthesis.getVoices();
    const pick = voices.find((v) => v.lang.toLowerCase().startsWith(currentLang.slice(0, 2)));
    if (pick) u.voice = pick;
    u.lang = currentLang;
    u.rate = 1.0;
    u.onend = () => { i++; nextChunk(); };
    u.onerror = () => { i++; nextChunk(); };
    speechSynthesis.speak(u);
  }
  nextChunk();
}

function listen() {
  if (!SR || busy) return;
  if (rec) { try { rec.stop(); } catch {} rec = null; }
  try { rec = new SR(); } catch { return; }
  rec.lang = currentLang;
  rec.continuous = true;
  rec.interimResults = true;
  buffer = [];

  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) {
        buffer.push(r[0].transcript.trim());
      } else {
        interim = r[0].transcript.trim();
      }
    }
    const shown = buffer.join(" ") + (interim ? " " + interim : "");
    transcriptEl.textContent = shown ? `"${shown}"` : "";

    // reset silence timer — if user stops talking for 2s, auto-send
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (!busy && buffer.join(" ").trim().length > 1) {
        try { rec.stop(); } catch {}
      }
    }, 2000);
  };

  rec.onerror = (ev) => {
    clearTimeout(silenceTimer);
    if (ev.error === "not-allowed") { setStatus("Microphone blocked — allow mic permission", ""); return; }
    if (busy) return;
    setTimeout(listen, 800);
  };

  rec.onend = () => {
    clearTimeout(silenceTimer);
    if (busy) return;
    const text = buffer.join(" ").trim();
    buffer = [];
    transcriptEl.textContent = "";
    if (text.length > 1) {
      transcriptEl.textContent = `"${text}"`;
      sendMessage(text);
    } else {
      listen();
    }
  };

  try {
    rec.start();
    setStatus("Listening…", "listening");
    setWave("listen");
  } catch {}
}

document.body.addEventListener("click", () => { if (!busy) listen(); }, { once: true });

// detect language from browser
try {
  const lang = navigator.language || "en-US";
  currentLang = lang;
} catch {}

// auth
document.getElementById("auth-btn").onclick = async () => {
  const pass = document.getElementById("auth-pass").value;
  document.getElementById("auth-error").textContent = "";
  if (!pass) { document.getElementById("auth-error").textContent = "enter password"; return; }
  try {
    const r = await apiCall("/api/auth/login", { method: "POST", body: { password: pass } });
    if (!r.ok) { document.getElementById("auth-error").textContent = "wrong password"; return; }
    const j = await r.json();
    token = j.token;
    localStorage.setItem("token", token);
    document.getElementById("auth-overlay").classList.add("hidden");
    setStatus("Tap anywhere to start", "");
  } catch (e) {
    document.getElementById("auth-error").textContent = e.message;
  }
};
document.getElementById("auth-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("auth-btn").click(); });

// if already logged in, check token validity
if (token) {
  apiCall("/api/health").then((r) => {
    if (r.ok) document.getElementById("auth-overlay").classList.add("hidden");
    else { token = ""; localStorage.removeItem("token"); }
  }).catch(() => {});
}
</script>
</body>
</html>
